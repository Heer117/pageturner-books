<head>

    <title>HTML Sitemap | Pageturner Books</title>

    <meta name="description"
          content="HTML sitemap for Pageturner Books. Find links to the home, menu and contact pages.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Georgia, 'Times New Roman', serif;
            background: #faf7f2;
            color: #2b2320;
        }
        header {
            background: #2b2320;
            color: #faf7f2;
            padding: 25px;
            text-align: center;
        }
        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 50px 20px;
        }
        h2 {
            margin-bottom: 25px;
            border-bottom: 2px solid #7a5c3e;
            padding-bottom: 8px;
        }
        ul {
            list-style: none;
        }
        li {
            background: #fff;
            border: 1px solid #e0d8cc;
            border-radius: 6px;
            padding: 18px;
            margin-bottom: 15px;
        }
        a {
            color: #7a5c3e;
            text-decoration: none;
            font-size: 1.1rem;
        }
        a:hover {
            text-decoration: underline;
        }
        footer {
            background: #2b2320;
            color: #faf7f2;
            text-align: center;
            padding: 25px;
            margin-top: 40px;
        }
    </style>
</head>
